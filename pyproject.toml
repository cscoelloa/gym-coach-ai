[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py"]
testpaths = ["apps"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "vendor", "migrations", "apps/workouts/bodymap/paths.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "S"]
ignore = [
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]
"**/tests/*.py" = ["S105", "S106"]

[tool.bandit]
exclude_dirs = [".venv", "vendor", "tests"]
