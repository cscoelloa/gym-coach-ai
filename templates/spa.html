{% load static vite %}<!DOCTYPE html>
<html lang="es" data-theme="light" data-theme-pref="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}FitUp{% endblock %}</title>

  <meta name="app-version" content="{% version_de_la_app %}">
  <link rel="manifest" href="{% url 'manifest' %}">
  <link rel="icon" type="image/png" href="{% static 'pwa/favicon.png' %}">

  <link rel="apple-touch-icon" href="{% static 'pwa/apple-touch-icon.png' %}">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FitUp">

  <script src="{% static 'js/theme.js' %}"></script>

  {% vite %}
</head>
<body>
  <div id="root"></div>
</body>
</html>
